name: TestDetta
description: Run only the .NET tests a change can affect, record coverage maps, and audit the selection on your own code.
branding:
  icon: filter
  color: blue

inputs:
  mode:
    description: "'test' on pull requests (run affected tests), 'shadow' on pull requests while you evaluate TestDetta (run every test, report what the selection would have left out, keep the report as an artifact; needs no license), 'record' on the default branch (record coverage maps), 'audit' on a schedule (break members of your code one at a time in a copy of the working tree, check the selection ran every test that failed, keep the report as an artifact; needs no license)."
    required: true
  base:
    description: Branch to compare with in test and shadow modes. Defaults to the pull request's base branch.
    required: false
    default: ''
  configuration:
    description: Build configuration for building and running the tests.
    required: false
    default: Debug
  projects:
    description: Record mode only. Test projects to record, one .csproj path per line. Empty records every test project.
    required: false
    default: ''
  parallel:
    description: Record mode only. Test host processes per test project; each still runs its tests one at a time. The suite must tolerate several test processes at once.
    required: false
    default: '1'
  no-build:
    description: Record mode only. 'true' to record from the build an earlier step made with the same configuration, instead of building again.
    required: false
    default: 'false'
  dotnet-test-args:
    description: "Test, shadow and audit modes. Extra arguments for every dotnet test, separated by spaces. In shadow mode, name your solution here (for example 'MySolution.sln') to have it run as one dotnet test command, as your own job runs it; without one, the one solution or project in working-directory runs, and with none there each test project runs on its own. Testing-platform (Microsoft.Testing.Platform) projects: build first in a step before this one, with the same configuration, and add --no-build here; TestDetta reads the report option a project takes from its build output, so a project not built before the run writes no report and its failures cannot be compared."
    required: false
    default: ''
  max-map-age:
    description: Test, shadow and audit modes. Use the newest coverage map recorded up to this many first-parent commits before the merge base; the changes in between are bridged. 0 uses only a map recorded at the merge base.
    required: false
    default: '50'
  drift-fallback:
    description: "Test, shadow and audit modes. When the changes since an older map include a build file, configuration or a global using: 'all' runs the affected test projects completely (safest), 'name' decides them by name (faster, blind to calls made through configuration or reflection)."
    required: false
    default: all
  shadow-rerun-timeout:
    description: "Shadow mode only. Longest one rerun of a project's left-out failed classes with the change may take: 90s, 15m, 1h or 1h30m; a plain number is minutes; 0 or none means no limit. Empty keeps the default (15m)."
    required: false
    default: ''
  shadow-rerun-idle-timeout:
    description: "Shadow mode only. Stop such a rerun after this long with almost no CPU (stuck). Same syntax; empty keeps the default (5m)."
    required: false
    default: ''
  shadow-base-timeout:
    description: "Shadow mode only. Longest the rerun on the base commit may take, its restore and build included. Same syntax; empty keeps the default (30m)."
    required: false
    default: ''
  shadow-base-idle-timeout:
    description: "Shadow mode only. Idle limit of the rerun on the base commit. Same syntax; empty keeps the default (10m)."
    required: false
    default: ''
  shadow-classify-budget:
    description: "Shadow mode only. Longest all classification reruns and the base checkout may take together; failures not classified by then are reported as not classified. The full run and the job's result are never affected. Same syntax; empty keeps the default (45m)."
    required: false
    default: ''
  shadow-analysis-timeout:
    description: "Shadow mode only. Longest TestDetta's analysis before the tests may take; past it every test runs without a comparison and the report says why. Same syntax; empty keeps the default (10m)."
    required: false
    default: ''
  shadow-artifact-suffix:
    description: "Shadow mode only. Added to the report artifact's name, for example the matrix values, to tell the legs of a matrix apart at a glance. The name is unique without it."
    required: false
    default: ''
  audit-target-broken:
    description: "Audit mode only. Stop once this many changes broke tests. Empty keeps the default (100, the n shadow mode's graduation asks for: with no miss and no inconclusive or stopped change, the 95% upper bound of the miss rate shows as 3.0%). The report says whether the run meets the graduation criterion and why not."
    required: false
    default: ''
  audit-max-mutants:
    description: "Audit mode only. Stop after this many changes ran tests. Empty keeps the default (no limit)."
    required: false
    default: ''
  audit-budget:
    description: "Audit mode only. Start no change after this long: 90s, 15m, 4h or 1h30m; a plain number is minutes; 0 or none means no limit. Empty keeps the default (4h). A change still running then finishes within its own run limits (several runs of the test projects that load it), so the audit can end after the budget; the report says by how much. Leave that headroom under the job's timeout-minutes: a job killed at its timeout reports the running change as stopped."
    required: false
    default: ''
  audit-parallel:
    description: "Audit mode only. Changes tested at once, each in its own copy of the working tree. Empty keeps the default (1); every one runs test hosts, so memory grows with it."
    required: false
    default: ''
  github-token:
    description: Test, shadow and audit modes. Token that lists the repository's Actions caches to find the newest map (needs the actions read permission). Without it only a map at the merge base is found.
    required: false
    default: ${{ github.token }}
  license:
    description: "Test mode only. The TestDetta license string, passed from a repository or organization secret such as TESTDETTA_LICENSE. Public repositories need none, and shadow and audit modes never read it. Without a valid license every test runs. The job never fails because of it."
    required: false
    default: ''
  working-directory:
    description: Any directory inside the repository to analyze.
    required: false
    default: '.'
  setup-dotnet:
    description: Install the .NET 10 SDK that TestDetta itself runs on. Set to 'false' if the job already has it.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # In shadow mode nothing before the tests may fail the job: a step that cannot do its part says why, sets
    # "skip", and the shadow step then runs the team's plain dotnet test instead of TestDetta.
    - name: Check git history
      id: history
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          if [ "$MODE" = shadow ]; then
            echo "::warning::TestDetta compares with a base commit and needs the full history (actions/checkout with fetch-depth: 0); shadow mode runs your tests as plain dotnet test instead."
            echo "skip=the checkout is shallow, and TestDetta needs the full history (actions/checkout with fetch-depth: 0)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::TestDetta compares with a base commit and needs the full history. Use actions/checkout with fetch-depth: 0."
          exit 1
        fi

    - name: Set up .NET for TestDetta
      if: inputs.setup-dotnet == 'true'
      id: setup
      continue-on-error: ${{ inputs.mode == 'shadow' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    # From source where the action has it (this repository's own workflows use it from the checkout);
    # otherwise the TestDetta package that tool.lock pins, checked against its SHA-512 before use.
    # A package that does not match its SHA-512 is never run, in any mode; shadow mode then runs plain dotnet test.
    - name: Get TestDetta
      id: tool
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        TESTDETTA_OUT: ${{ runner.temp }}/testdetta
        MODE: ${{ inputs.mode }}
      run: |
        fail() {
          if [ "$MODE" = shadow ]; then
            echo "::warning::$1; shadow mode runs your tests as plain dotnet test instead."
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$1."
          exit 1
        }
        if [ -f src/TestDetta.Cli/TestDetta.Cli.csproj ]; then
          dotnet build src/TestDetta.Cli/TestDetta.Cli.csproj -c Release -o "$TESTDETTA_OUT" --nologo -v quiet || fail "TestDetta could not be built from the action's source"
          exit 0
        fi
        read -r version sha512 < tool.lock
        package="$RUNNER_TEMP/testdetta.$version.nupkg"
        curl -fsSL --retry 3 "https://api.nuget.org/v3-flatcontainer/testdetta/$version/testdetta.$version.nupkg" -o "$package" || fail "The TestDetta $version package could not be downloaded"
        if command -v sha512sum > /dev/null; then actual=$(sha512sum "$package" | cut -d' ' -f1); else actual=$(shasum -a 512 "$package" | cut -d' ' -f1); fi
        if [ "$actual" != "$sha512" ]; then
          rm -f "$package"
          fail "The TestDetta $version package does not match the SHA-512 in tool.lock; it was not run"
        fi
        rm -rf "$RUNNER_TEMP/testdetta-package" && mkdir -p "$TESTDETTA_OUT"
        unzip -q -o "$package" 'tools/net10.0/any/*' -d "$RUNNER_TEMP/testdetta-package" || fail "The TestDetta $version package could not be unpacked"
        cp -R "$RUNNER_TEMP/testdetta-package/tools/net10.0/any/." "$TESTDETTA_OUT/"

    - name: Find comparison base
      if: inputs.mode == 'test' || inputs.mode == 'shadow' && steps.history.outputs.skip == '' && steps.tool.outputs.skip == ''
      id: base
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.base_ref }}
        MODE: ${{ inputs.mode }}
      run: |
        fail() {
          if [ "$MODE" = shadow ]; then
            echo "::warning::$1; shadow mode runs your tests as plain dotnet test instead."
            echo "skip=$1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$1."
          exit 1
        }
        base="${INPUT_BASE:-$PR_BASE}"
        if [ -z "$base" ]; then
          fail "No base branch: outside pull requests, set the 'base' input"
        fi
        # The name ends up in git arguments and in step outputs: allow plain branch names only.
        if [[ ! "$base" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]]; then
          fail "Unsupported base branch name"
        fi
        # actions/checkout with fetch-depth: 0 already has every branch. Fetch only when the base is
        # missing: with persist-credentials: false a private repository cannot be fetched again.
        if ! git rev-parse --verify --quiet "refs/remotes/origin/$base^{commit}" > /dev/null; then
          if ! git fetch --no-tags --quiet origin "+refs/heads/$base:refs/remotes/origin/$base"; then
            fail "Could not fetch the base branch: check out with fetch-depth: 0, or keep the checkout's credentials"
          fi
        fi
        merge_base=$(git merge-base "origin/$base" HEAD) || fail "The base branch shares no history with this commit"
        echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
        echo "merge-base=$merge_base" >> "$GITHUB_OUTPUT"

    - name: Find newest coverage map
      if: inputs.mode == 'test' || inputs.mode == 'audit' || inputs.mode == 'shadow' && steps.history.outputs.skip == '' && steps.tool.outputs.skip == '' && steps.base.outputs.skip == ''
      id: map
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        MERGE_BASE: ${{ steps.base.outputs.merge-base }}
        MAX_MAP_AGE: ${{ inputs.max-map-age }}
      run: |
        # The audit compares every change with the commit it runs on.
        if [ "$MODE" = audit ]; then MERGE_BASE=$(git rev-parse HEAD); fi
        if [[ ! "$MAX_MAP_AGE" =~ ^[0-9]{1,4}$ ]]; then
          if [ "$MODE" = shadow ]; then
            echo "::warning::'max-map-age' must be a number of commits from 0 to 9999; shadow mode runs your tests as plain dotnet test instead."
            echo "skip='max-map-age' is not a number of commits from 0 to 9999" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::'max-map-age' must be a number of commits from 0 to 9999."
          exit 1
        fi
        echo "max-age=$MAX_MAP_AGE" >> "$GITHUB_OUTPUT"
        key="testdetta-coverage-$MERGE_BASE"
        # Restore keys match by prefix and pick the newest cache, not the newest ancestor, so the
        # caches are listed and matched against the merge base's first-parent history here.
        if [ "$MAX_MAP_AGE" != 0 ]; then
          if keys=$(gh cache list --key testdetta-coverage- --limit 1000 --json key --jq '.[].key' 2> cache-list.err); then
            for sha in $(git rev-list --first-parent -n "$((MAX_MAP_AGE + 1))" "$MERGE_BASE"); do
              if grep -qx "testdetta-coverage-$sha" <<< "$keys"; then
                key="testdetta-coverage-$sha"
                break
              fi
            done
          else
            echo "::notice::Could not list the Actions caches ($(head -c 300 cache-list.err)); only a map at the merge base is used. Give the job 'actions: read'."
          fi
          rm -f cache-list.err
        fi
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore coverage map
      if: inputs.mode == 'test' || inputs.mode == 'audit' || inputs.mode == 'shadow' && steps.map.outputs.skip == '' && steps.map.outputs.key != ''
      continue-on-error: ${{ inputs.mode == 'shadow' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/.testdetta/coverage
        key: ${{ steps.map.outputs.key }}

    - name: Run affected tests
      if: inputs.mode == 'test'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTDETTA: ${{ runner.temp }}/testdetta/TestDetta.Cli.dll
        BASE_REF: ${{ steps.base.outputs.ref }}
        CONFIGURATION: ${{ inputs.configuration }}
        EXTRA_ARGS: ${{ inputs.dotnet-test-args }}
        MAX_MAP_AGE: ${{ steps.map.outputs.max-age }}
        DRIFT_FALLBACK: ${{ inputs.drift-fallback }}
        TESTDETTA_LICENSE: ${{ inputs.license }}
      run: |
        read -r -a extra <<< "$EXTRA_ARGS"
        dotnet "$TESTDETTA" test --base "$BASE_REF" --max-map-age "$MAX_MAP_AGE" --drift-fallback "$DRIFT_FALLBACK" --summary-file "$GITHUB_STEP_SUMMARY" -- -c "$CONFIGURATION" "${extra[@]}"

    # Shadow mode (docs/design/shadow-mode.md): every test runs as without TestDetta and the job's result is
    # that run's; the report says what the selection would have left out. dotnet test runs as given (one command
    # for a solution) when its reports can be matched to test projects, otherwise per project, and the report
    # says why. No license is read and TestDetta sends nothing, so the license secret is not passed to this step.
    # When a step before could not do its part, or td ends without a result of the tests (a crash, an invalid
    # option), the team's own dotnet test runs here instead, with the same arguments, and the summary says why.
    - name: Run every test in shadow mode
      if: inputs.mode == 'shadow'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTDETTA: ${{ runner.temp }}/testdetta/TestDetta.Cli.dll
        BASE_REF: ${{ steps.base.outputs.ref }}
        CONFIGURATION: ${{ inputs.configuration }}
        EXTRA_ARGS: ${{ inputs.dotnet-test-args }}
        MAX_MAP_AGE: ${{ steps.map.outputs.max-age }}
        DRIFT_FALLBACK: ${{ inputs.drift-fallback }}
        SHADOW_REPORT: ${{ runner.temp }}/testdetta-shadow/testdetta-shadow.json
        SHADOW_RERUN_TIMEOUT: ${{ inputs.shadow-rerun-timeout }}
        SHADOW_RERUN_IDLE_TIMEOUT: ${{ inputs.shadow-rerun-idle-timeout }}
        SHADOW_BASE_TIMEOUT: ${{ inputs.shadow-base-timeout }}
        SHADOW_BASE_IDLE_TIMEOUT: ${{ inputs.shadow-base-idle-timeout }}
        SHADOW_CLASSIFY_BUDGET: ${{ inputs.shadow-classify-budget }}
        SHADOW_ANALYSIS_TIMEOUT: ${{ inputs.shadow-analysis-timeout }}
        SKIP_HISTORY: ${{ steps.history.outputs.skip }}
        SKIP_SETUP: ${{ steps.setup.outcome == 'failure' && 'the .NET SDK TestDetta runs on could not be set up' || '' }}
        SKIP_TOOL: ${{ steps.tool.outputs.skip }}
        SKIP_BASE: ${{ steps.base.outputs.skip }}
        SKIP_MAP: ${{ steps.map.outputs.skip }}
      run: |
        read -r -a extra <<< "$EXTRA_ARGS"
        # $1: why; $2: what happened before, "did not run" by default.
        plain() {
          what="${2:-TestDetta did not run}"
          echo "::warning::$what ($1); your tests run as plain dotnet test, and this run has no shadow result."
          { echo "### TestDetta shadow run"; echo; echo "**$what: $1. Your tests ran as plain \`dotnet test\` with the same arguments; the job's result is that run's, and this run has no shadow result.**"; echo; } >> "$GITHUB_STEP_SUMMARY"
          dotnet test -c "$CONFIGURATION" "${extra[@]}"
        }
        reason="${SKIP_HISTORY:-${SKIP_SETUP:-${SKIP_TOOL:-${SKIP_BASE:-$SKIP_MAP}}}}"
        if [ -n "$reason" ]; then
          plain "$reason"
          exit 0
        fi
        # Only the limits given are passed; td checks their syntax and keeps its defaults for the rest.
        limits=()
        if [ -n "$SHADOW_RERUN_TIMEOUT" ]; then limits+=(--shadow-rerun-timeout "$SHADOW_RERUN_TIMEOUT"); fi
        if [ -n "$SHADOW_RERUN_IDLE_TIMEOUT" ]; then limits+=(--shadow-rerun-idle-timeout "$SHADOW_RERUN_IDLE_TIMEOUT"); fi
        if [ -n "$SHADOW_BASE_TIMEOUT" ]; then limits+=(--shadow-base-timeout "$SHADOW_BASE_TIMEOUT"); fi
        if [ -n "$SHADOW_BASE_IDLE_TIMEOUT" ]; then limits+=(--shadow-base-idle-timeout "$SHADOW_BASE_IDLE_TIMEOUT"); fi
        if [ -n "$SHADOW_CLASSIFY_BUDGET" ]; then limits+=(--shadow-classify-budget "$SHADOW_CLASSIFY_BUDGET"); fi
        if [ -n "$SHADOW_ANALYSIS_TIMEOUT" ]; then limits+=(--shadow-analysis-timeout "$SHADOW_ANALYSIS_TIMEOUT"); fi
        status=0
        dotnet "$TESTDETTA" test --shadow --shadow-report "$SHADOW_REPORT" "${limits[@]}" --base "$BASE_REF" --max-map-age "$MAX_MAP_AGE" --drift-fallback "$DRIFT_FALLBACK" --summary-file "$GITHUB_STEP_SUMMARY" -- -c "$CONFIGURATION" "${extra[@]}" || status=$?
        # 0 and 3 are the tests' own result (passed, failed). Anything else: td ended without a result of the tests
        # it can give (an error before they ran, or a process killed from outside, perhaps after they ran), so the
        # tests run (again) as plain dotnet test.
        if [ "$status" = 0 ] || [ "$status" = 3 ]; then exit "$status"; fi
        plain "it ended with exit code $status without a result of the tests, so they may run a second time here" "TestDetta shadow mode ended without a result"

    # Unique per job and matrix leg: the job id, a hash of what tells legs apart, and the check run's id (or a
    # random part where the runner does not give one), so two legs of one run never ask for the same name.
    - name: Name the shadow report
      if: always() && inputs.mode == 'shadow'
      id: artifact
      shell: bash
      env:
        JOB: ${{ github.job }}
        CHECK_RUN: ${{ job.check_run_id }}
        LEG: ${{ runner.os }}|${{ runner.arch }}|${{ inputs.working-directory }}|${{ inputs.configuration }}|${{ inputs.dotnet-test-args }}|${{ inputs.shadow-artifact-suffix }}
        SUFFIX: ${{ inputs.shadow-artifact-suffix }}
      run: |
        if command -v sha256sum > /dev/null; then hash=$(printf '%s' "$LEG" | sha256sum | cut -c1-10); else hash=$(printf '%s' "$LEG" | shasum -a 256 | cut -c1-10); fi
        unique="${CHECK_RUN:-$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')}"
        name="testdetta-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${JOB}-${hash}-${unique}${SUFFIX:+-$SUFFIX}"
        # Only characters every artifact name may hold.
        echo "name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-200)" >> "$GITHUB_OUTPUT"

    # Kept whether the tests passed or not, for a roll-up over pull requests (not built yet; docs/design/shadow-mode.md).
    # An upload that fails costs the artifact, never the job.
    - name: Keep the shadow report
      if: always() && inputs.mode == 'shadow'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ runner.temp }}/testdetta-shadow/testdetta-shadow.json
        if-no-files-found: ignore
        retention-days: 90

    # The audit (docs/design/audit.md): every change is written into a copy of the working tree under RUNNER_TEMP,
    # tested there and taken out again; the checkout and its build output are only read. No license is read and
    # TestDetta itself sends nothing (the builds in the copy restore packages as the team's do), so the license
    # secret is not passed to this step. Meant for a schedule: it runs for hours.
    - name: Audit the selection on your code
      if: inputs.mode == 'audit'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTDETTA: ${{ runner.temp }}/testdetta/TestDetta.Cli.dll
        CONFIGURATION: ${{ inputs.configuration }}
        EXTRA_ARGS: ${{ inputs.dotnet-test-args }}
        MAX_MAP_AGE: ${{ steps.map.outputs.max-age }}
        DRIFT_FALLBACK: ${{ inputs.drift-fallback }}
        AUDIT_REPORT: ${{ runner.temp }}/testdetta-audit/testdetta-audit.json
        AUDIT_TARGET_BROKEN: ${{ inputs.audit-target-broken }}
        AUDIT_MAX_MUTANTS: ${{ inputs.audit-max-mutants }}
        AUDIT_BUDGET: ${{ inputs.audit-budget }}
        AUDIT_PARALLEL: ${{ inputs.audit-parallel }}
      run: |
        read -r -a extra <<< "$EXTRA_ARGS"
        # Only the limits given are passed; td checks their syntax and keeps its defaults for the rest.
        limits=()
        if [ -n "$AUDIT_TARGET_BROKEN" ]; then limits+=(--target-broken "$AUDIT_TARGET_BROKEN"); fi
        if [ -n "$AUDIT_MAX_MUTANTS" ]; then limits+=(--max-mutants "$AUDIT_MAX_MUTANTS"); fi
        if [ -n "$AUDIT_BUDGET" ]; then limits+=(--budget "$AUDIT_BUDGET"); fi
        if [ -n "$AUDIT_PARALLEL" ]; then limits+=(--parallel "$AUDIT_PARALLEL"); fi
        dotnet "$TESTDETTA" audit --report "$AUDIT_REPORT" --work-dir "$RUNNER_TEMP" "${limits[@]}" --max-map-age "$MAX_MAP_AGE" --drift-fallback "$DRIFT_FALLBACK" --summary-file "$GITHUB_STEP_SUMMARY" -- -c "$CONFIGURATION" "${extra[@]}"

    # Kept whatever the result, for the graduation evidence (docs/design/shadow-mode.md).
    - name: Keep the audit report
      if: always() && inputs.mode == 'audit'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: testdetta-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/testdetta-audit/testdetta-audit.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Record coverage map
      if: inputs.mode == 'record'
      id: record
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTDETTA: ${{ runner.temp }}/testdetta/TestDetta.Cli.dll
        CONFIGURATION: ${{ inputs.configuration }}
        PROJECTS: ${{ inputs.projects }}
        PARALLEL: ${{ inputs.parallel }}
        NO_BUILD: ${{ inputs.no-build }}
      run: |
        if [[ ! "$PARALLEL" =~ ^[1-9][0-9]?$ ]]; then
          echo "::error::'parallel' must be a number from 1 to 99."
          exit 1
        fi
        args=(--parallel "$PARALLEL")
        if [ "$NO_BUILD" = "true" ]; then args+=(--no-build); fi
        while IFS= read -r project; do
          if [ -n "$project" ]; then args+=(--project "$project"); fi
        done <<< "$PROJECTS"
        status=0
        dotnet "$TESTDETTA" record -c "$CONFIGURATION" "${args[@]}" || status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        # 3 means some tests failed; the map is still valid, so it is saved before the job fails.
        if [ "$status" != 0 ] && [ "$status" != 3 ]; then exit "$status"; fi

    - name: Save coverage map
      if: inputs.mode == 'record'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/.testdetta/coverage
        key: testdetta-coverage-${{ github.sha }}

    - name: Fail on test failures while recording
      if: inputs.mode == 'record' && steps.record.outputs.status == '3'
      shell: bash
      run: |
        echo "::error::Tests failed while recording coverage."
        exit 1
