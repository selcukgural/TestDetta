name: Sift
description: Run only the .NET tests a change affects on pull requests, and record coverage maps on the default branch.
branding:
  icon: filter
  color: blue

inputs:
  mode:
    description: "'test' on pull requests (run affected tests), 'record' on the default branch (record coverage maps)."
    required: true
  base:
    description: Branch to compare with in test mode. Defaults to the pull request's base branch.
    required: false
    default: ''
  configuration:
    description: Build configuration for building and running the tests.
    required: false
    default: Debug
  projects:
    description: Record mode only. Test projects to record, one .csproj path per line. Empty records every test project.
    required: false
    default: ''
  parallel:
    description: Record mode only. Test host processes per test project; each still runs its tests one at a time. The suite must tolerate several test processes at once.
    required: false
    default: '1'
  no-build:
    description: Record mode only. 'true' to record from the build an earlier step made with the same configuration, instead of building again.
    required: false
    default: 'false'
  dotnet-test-args:
    description: Test mode only. Extra arguments for every dotnet test, separated by spaces.
    required: false
    default: ''
  max-map-age:
    description: Test mode only. Use the newest coverage map recorded up to this many first-parent commits before the merge base; the changes in between are bridged. 0 uses only a map recorded at the merge base.
    required: false
    default: '50'
  github-token:
    description: Test mode only. Token that lists the repository's Actions caches to find the newest map (needs the actions read permission). Without it only a map at the merge base is found.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Any directory inside the repository to analyze.
    required: false
    default: '.'
  setup-dotnet:
    description: Install the .NET 10 SDK that Sift itself runs on. Set to 'false' if the job already has it.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check git history
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Sift compares with a base commit and needs the full history. Use actions/checkout with fetch-depth: 0."
          exit 1
        fi

    - name: Set up .NET for Sift
      if: inputs.setup-dotnet == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build Sift
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SIFT_OUT: ${{ runner.temp }}/sift
      run: dotnet build src/Sift.Cli/Sift.Cli.csproj -c Release -o "$SIFT_OUT" --nologo -v quiet

    - name: Find comparison base
      if: inputs.mode == 'test'
      id: base
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.base_ref }}
      run: |
        base="${INPUT_BASE:-$PR_BASE}"
        if [ -z "$base" ]; then
          echo "::error::No base branch. Outside pull requests, set the 'base' input."
          exit 1
        fi
        # The name ends up in git arguments and in step outputs: allow plain branch names only.
        if [[ ! "$base" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]]; then
          echo "::error::Unsupported base branch name."
          exit 1
        fi
        # actions/checkout with fetch-depth: 0 already has every branch. Fetch only when the base is
        # missing: with persist-credentials: false a private repository cannot be fetched again.
        if ! git rev-parse --verify --quiet "refs/remotes/origin/$base^{commit}" > /dev/null; then
          if ! git fetch --no-tags --quiet origin "+refs/heads/$base:refs/remotes/origin/$base"; then
            echo "::error::Could not fetch the base branch. Check out with fetch-depth: 0, or keep the checkout's credentials."
            exit 1
          fi
        fi
        echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
        echo "merge-base=$(git merge-base "origin/$base" HEAD)" >> "$GITHUB_OUTPUT"

    - name: Find newest coverage map
      if: inputs.mode == 'test'
      id: map
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        MERGE_BASE: ${{ steps.base.outputs.merge-base }}
        MAX_MAP_AGE: ${{ inputs.max-map-age }}
      run: |
        if [[ ! "$MAX_MAP_AGE" =~ ^[0-9]{1,4}$ ]]; then
          echo "::error::'max-map-age' must be a number of commits from 0 to 9999."
          exit 1
        fi
        echo "max-age=$MAX_MAP_AGE" >> "$GITHUB_OUTPUT"
        key="sift-coverage-$MERGE_BASE"
        # Restore keys match by prefix and pick the newest cache, not the newest ancestor, so the
        # caches are listed and matched against the merge base's first-parent history here.
        if [ "$MAX_MAP_AGE" != 0 ]; then
          if keys=$(gh cache list --key sift-coverage- --limit 1000 --json key --jq '.[].key' 2> cache-list.err); then
            for sha in $(git rev-list --first-parent -n "$((MAX_MAP_AGE + 1))" "$MERGE_BASE"); do
              if grep -qx "sift-coverage-$sha" <<< "$keys"; then
                key="sift-coverage-$sha"
                break
              fi
            done
          else
            echo "::notice::Could not list the Actions caches ($(head -c 300 cache-list.err)); only a map at the merge base is used. Give the job 'actions: read'."
          fi
          rm -f cache-list.err
        fi
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore coverage map
      if: inputs.mode == 'test'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/.sift/coverage
        key: ${{ steps.map.outputs.key }}

    - name: Run affected tests
      if: inputs.mode == 'test'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SIFT: ${{ runner.temp }}/sift/Sift.Cli.dll
        BASE_REF: ${{ steps.base.outputs.ref }}
        CONFIGURATION: ${{ inputs.configuration }}
        EXTRA_ARGS: ${{ inputs.dotnet-test-args }}
        MAX_MAP_AGE: ${{ steps.map.outputs.max-age }}
      run: |
        read -r -a extra <<< "$EXTRA_ARGS"
        dotnet "$SIFT" test --base "$BASE_REF" --max-map-age "$MAX_MAP_AGE" --summary-file "$GITHUB_STEP_SUMMARY" -- -c "$CONFIGURATION" "${extra[@]}"

    - name: Record coverage map
      if: inputs.mode == 'record'
      id: record
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SIFT: ${{ runner.temp }}/sift/Sift.Cli.dll
        CONFIGURATION: ${{ inputs.configuration }}
        PROJECTS: ${{ inputs.projects }}
        PARALLEL: ${{ inputs.parallel }}
        NO_BUILD: ${{ inputs.no-build }}
      run: |
        if [[ ! "$PARALLEL" =~ ^[1-9][0-9]?$ ]]; then
          echo "::error::'parallel' must be a number from 1 to 99."
          exit 1
        fi
        args=(--parallel "$PARALLEL")
        if [ "$NO_BUILD" = "true" ]; then args+=(--no-build); fi
        while IFS= read -r project; do
          if [ -n "$project" ]; then args+=(--project "$project"); fi
        done <<< "$PROJECTS"
        status=0
        dotnet "$SIFT" record -c "$CONFIGURATION" "${args[@]}" || status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        # 3 means some tests failed; the map is still valid, so it is saved before the job fails.
        if [ "$status" != 0 ] && [ "$status" != 3 ]; then exit "$status"; fi

    - name: Save coverage map
      if: inputs.mode == 'record'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/.sift/coverage
        key: sift-coverage-${{ github.sha }}

    - name: Fail on test failures while recording
      if: inputs.mode == 'record' && steps.record.outputs.status == '3'
      shell: bash
      run: |
        echo "::error::Tests failed while recording coverage."
        exit 1
