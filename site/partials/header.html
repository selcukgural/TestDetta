<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="{{name}} {{home}}">
      <svg class="logo-mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><g class="logo-t"><rect x="4" y="8" width="25" height="10"/><rect x="11.5" y="8" width="10" height="48"/></g><path class="logo-d" d="M31 8 H38 A24 24 0 0 1 38 56 H31 V46 H38 A14 14 0 0 0 38 18 H31 Z"/></svg>
      <span>{{name}}</span>
    </a>
    <nav class="main-nav" aria-label="{{navMain}}">
      <a href="/docs/" class="nav-link">{{navDocs}}</a>
      <a href="/docs/github-actions/" class="nav-link nav-extra">{{navGitHubActions}}</a>
      <a href="{{sponsorUrl}}" class="nav-link nav-sponsor" rel="noopener" title="{{navSponsor}}"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 13.6S2.2 10.2 2.2 6.1C2.2 4 3.7 2.6 5.5 2.6c1.1 0 2 .6 2.5 1.4.5-.8 1.4-1.4 2.5-1.4 1.8 0 3.3 1.4 3.3 3.5 0 4.1-5.8 7.5-5.8 7.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="nav-sponsor-label">{{navSponsor}}</span></a>
      <!--languages-->
      <button type="button" class="header-control theme-toggle" data-label="{{theme}}" data-light="{{themeLight}}" data-dark="{{themeDark}}" aria-label="{{theme}}">
        <svg class="icon icon-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="icon icon-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
      <a class="button button-small" href="/docs/">{{getStarted}}</a>
    </nav>
  </div>
</header>
