<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <a class="brand" href="/"><img src="/assets/collie.svg" alt="" width="26" height="26"><span>{{name}}</span></a>
      <p class="muted">{{tagline}}<br>{{taglineSafety}}</p>
    </div>
    <div>
      <h2>{{footerProduct}}</h2>
      <ul>
        <li><a href="/docs/">{{navDocs}}</a></li>
        <li><a href="/pricing/">{{navPricing}}</a></li>
        <li><a href="/docs/how-it-works/">{{footerHowItDecides}}</a></li>
      </ul>
    </div>
    <div>
      <h2>{{footerCompany}}</h2>
      <ul>
        <li><a href="mailto:{{supportEmail}}">{{supportEmail}}</a></li>
        <li><a href="/legal/terms/">{{footerTerms}}</a></li>
        <li><a href="/legal/privacy/">{{footerPrivacy}}</a></li>
        <li><a href="/legal/refunds/">{{footerRefunds}}</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap footer-base muted">© {{year}} {{licensor}}. {{footerPayments}}</div>
</footer>
