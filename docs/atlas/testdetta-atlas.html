<title>TestDetta Atlası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: an IDE shell. Explorer (chapters → steps) | center views (Şema, Çağrı ağacı, Kod, Okuma) over a player |
   Inspector (what the step is: who, file, in, out, purpose, details). Breadcrumb + ⌘K palette on top, status bar below.
   Dark-first editor palette with a light variant; amber marks the signal, blue the focus. */
:root {
  --bg: #0e1015; --panel: #141720; --panel2: #1a1e29; --raise: #20263380; --line: #252b38; --line2: #313849;
  --fg: #d7dce6; --fg2: #aab2c2; --muted: #788196; --focus: #7aa2ff; --focus-bg: #1f2b47; --signal: #f0b35a; --signal-bg: #3a2c16;
  --ok: #7ccf9a; --warn: #f2937a; --type: #c792ea; --str: #b5e08d; --num: #f78c6c; --com: #5c6680; --kw: #82aaff;
  --sans: "Geist", "Segoe UI", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --raise: #e9edf380; --line: #e1e4ea; --line2: #cfd4dd;
    --fg: #161a22; --fg2: #3d4554; --muted: #6a7384; --focus: #3461d9; --focus-bg: #e5ecfd; --signal: #b86a12; --signal-bg: #fbecd6;
    --ok: #23855a; --warn: #c2512f; --type: #8a3fb0; --str: #2f7d32; --num: #b5521c; --com: #8a93a3; --kw: #2f5bd0; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #f0f2f5; --raise: #e9edf380; --line: #e1e4ea; --line2: #cfd4dd;
  --fg: #161a22; --fg2: #3d4554; --muted: #6a7384; --focus: #3461d9; --focus-bg: #e5ecfd; --signal: #b86a12; --signal-bg: #fbecd6;
  --ok: #23855a; --warn: #c2512f; --type: #8a3fb0; --str: #2f7d32; --num: #b5521c; --com: #8a93a3; --kw: #2f5bd0; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13.5px; line-height: 1.55; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 0.92em; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.shell { height: 100%; min-height: 620px; display: grid; grid-template-rows: 42px minmax(0, 1fr) 26px; padding-inline: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--signal); display: inline-block; }
.menu { display: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.crumbs { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumbs b { color: var(--fg); font-weight: 500; }
.palette-btn { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px 4px 12px; color: var(--muted); cursor: pointer; min-width: 220px; }
.palette-btn:hover { border-color: var(--line2); color: var(--fg2); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--fg2); background: var(--panel); }
.theme-btn { background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; cursor: pointer; color: var(--fg2); }

.body { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; min-height: 0; }
.explorer { background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.explorer .filter { margin: 10px; }
.explorer input { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; color: var(--fg); font: 12.5px var(--sans); }
.tree { overflow: auto; padding: 0 6px 12px; }
.ch > button { width: 100%; text-align: left; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 6px; color: var(--fg); font-weight: 500; }
.ch > button:hover { background: var(--panel2); }
.ch > button .chev { width: 12px; color: var(--muted); transition: transform 150ms; font-size: 10px; }
.ch.open > button .chev { transform: rotate(90deg); }
.ch > button .num { font-family: var(--mono); font-size: 11px; color: var(--signal); }
.ch .steps { display: none; padding-left: 14px; border-left: 1px solid var(--line); margin-left: 13px; }
.ch.open .steps { display: grid; }
.steps button { text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; background: none; border: 0; padding: 4px 8px; border-radius: 5px; cursor: pointer; color: var(--fg2); font-size: 12.5px; line-height: 1.4; }
.steps button .n { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 1px; }
.steps button:hover { background: var(--panel2); color: var(--fg); }
.steps button.on { background: var(--focus-bg); color: var(--fg); }
.steps button.on .n { color: var(--focus); }
.steps button[hidden] { display: none; }

.center { display: grid; grid-template-rows: 38px minmax(0, 1fr) 44px; min-width: 0; min-height: 0; background: var(--bg); }
.tabs { display: flex; align-items: stretch; gap: 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 16px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tabs button kbd { opacity: 0.7; }
.tabs button.on { color: var(--fg); background: var(--bg); box-shadow: inset 0 2px 0 var(--focus); }
.view { overflow: auto; min-height: 0; position: relative; }
.view[hidden] { display: none; }
.view.diagram { background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; padding: 16px; }
.view.diagram svg { display: block; width: 100%; min-width: 760px; height: auto; max-height: 100%; }
.player { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); }
.player button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.player button:hover { border-color: var(--line2); }
.player button.go { background: var(--focus); border-color: var(--focus); color: var(--bg); font-weight: 600; min-width: 92px; }
.scrub { flex: 1; height: 6px; background: var(--line); border-radius: 6px; position: relative; cursor: pointer; }
.scrub i { position: absolute; inset: 0 auto 0 0; background: var(--focus); border-radius: 6px; transition: width 250ms; }
.player .count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }

.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; min-height: 0; }
.insp-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.insp-head .eyebrow { font-family: var(--mono); font-size: 11px; color: var(--signal); letter-spacing: 0.04em; }
.insp-head h2 { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sect { border-bottom: 1px solid var(--line); }
.sect h3 { margin: 0; padding: 8px 16px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--panel2); }
.sect .c { padding: 10px 16px; color: var(--fg2); min-width: 0; overflow-wrap: anywhere; }
.sect .c > * + * { margin-top: 8px; }
.sect .c.mono { font-family: var(--mono); font-size: 12px; color: var(--fg); }
.sect .c ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.sect .c p { margin: 0; }
.file { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.file span { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
.mini { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; cursor: pointer; font-size: 11.5px; color: var(--fg2); white-space: nowrap; }
.mini:hover { border-color: var(--line2); color: var(--fg); }

/* Code view */
.codeview { padding: 16px; display: grid; gap: 14px; align-content: start; }
.codeblock { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.codeblock .cb-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.codeblock .cb-head .mini { margin-left: auto; }
.codeblock pre { margin: 0; padding: 12px 14px; font: 12.5px/1.65 var(--mono); overflow-x: auto; color: var(--fg); counter-reset: ln; }
.codeblock pre .ln { display: block; padding-left: 3.2em; position: relative; white-space: pre; }
.codeblock pre .ln::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 2.2em; text-align: right; color: var(--com); }
.tk-kw { color: var(--kw); } .tk-type { color: var(--type); } .tk-str { color: var(--str); } .tk-num { color: var(--num); } .tk-com { color: var(--com); font-style: italic; }
.empty { color: var(--muted); padding: 24px; display: grid; gap: 8px; max-width: 60ch; }

/* Reading view */
.reading { padding: 24px 28px 48px; display: grid; gap: 18px; max-width: 900px; }
.reading .kicker { font-family: var(--mono); font-size: 12px; color: var(--signal); }
.reading h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.reading .lead { color: var(--fg2); max-width: 70ch; }
.reading .note { border-left: 3px solid var(--signal); background: var(--panel); padding: 10px 14px; border-radius: 0 8px 8px 0; color: var(--fg2); max-width: 75ch; }
.timeline { border-left: 2px solid var(--line); margin-left: 12px; display: grid; }
.tl { position: relative; padding: 0 0 18px 24px; cursor: pointer; }
.tl::before { content: attr(data-n); position: absolute; left: -14px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line2); font: 600 11px var(--mono); display: grid; place-items: center; color: var(--muted); }
.tl.on::before { background: var(--focus); border-color: var(--focus); color: var(--bg); }
.tl h4 { margin: 2px 0 4px; font-size: 14.5px; font-weight: 600; }
.tl p { margin: 0; color: var(--fg2); max-width: 68ch; }
.tl .who { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tl:hover h4 { color: var(--focus); }

/* Waterfall */
.waterfall { padding: 8px 0 24px; font-size: 12.5px; }
.wf-ruler { display: grid; grid-template-columns: minmax(260px, 42%) minmax(0, 1fr); padding: 0 16px 6px; color: var(--muted); font-family: var(--mono); font-size: 11px; border-bottom: 1px solid var(--line); }
.wf-ruler .ticks { display: flex; justify-content: space-between; }
.wf-row { display: grid; grid-template-columns: minmax(260px, 42%) minmax(0, 1fr); align-items: center; padding: 3px 16px; cursor: pointer; }
.wf-row:hover { background: var(--panel); }
.wf-row.on { background: var(--focus-bg); box-shadow: inset 2px 0 0 var(--focus); }
.wf-row .nm { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-row .nm i { font-style: normal; color: var(--muted); }
.wf-row .lane { position: relative; height: 16px; }
.wf-row .lane b { position: absolute; top: 3px; height: 10px; border-radius: 3px; }
.wf-note { padding: 10px 16px; color: var(--muted); font-size: 12px; }

/* Catalog */
.catalog { padding: 16px; display: grid; gap: 12px; align-content: start; }
.catalog table { border-collapse: collapse; width: 100%; font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.catalog th, .catalog td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.catalog th { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--panel2); position: sticky; top: 0; }
.catalog td.name { font-family: var(--mono); white-space: nowrap; color: var(--fg); }
.catalog td .area { font-size: 11px; color: var(--muted); }
.catalog tr[hidden] { display: none; }

/* Diagram (SVG) */
.node rect, .node path.box { fill: var(--panel); stroke-width: 1.5; transition: fill 200ms, stroke 200ms, opacity 200ms; }
.node text { font-family: var(--sans); fill: var(--fg); font-size: 15px; font-weight: 500; }
.node text.sub { font-family: var(--mono); fill: var(--muted); font-size: 11.5px; font-weight: 400; }
.node.k-actor rect { stroke: var(--focus); } .node.k-core rect { stroke: var(--line2); } .node.k-data path.box { stroke: var(--type); }
.node.k-tool rect { stroke: var(--muted); stroke-dasharray: 4 3; } .node.k-cmd rect { stroke: var(--signal); }
.node.k-q rect { stroke: var(--focus); } .node.k-q text { font-size: 14px; }
.node.k-yes rect { stroke: var(--ok); stroke-width: 2.2; } .node.k-no rect { stroke: var(--warn); stroke-width: 2.2; }
.node.dim { opacity: 0.35; }
.node.on rect, .node.on path.box { fill: var(--signal-bg); stroke: var(--signal); stroke-width: 2.4; }
.node.on.k-yes rect { fill: var(--panel); stroke: var(--ok); stroke-width: 3.4; } .node.on.k-no rect { fill: var(--panel); stroke: var(--warn); stroke-width: 3.4; }
.node { cursor: default; }
.edge path { fill: none; stroke: var(--line2); stroke-width: 1.5; transition: stroke 200ms, opacity 200ms; }
.edge text { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.edge.dim { opacity: 0.25; }
.edge.on path { stroke: var(--signal); stroke-width: 2.4; }
.edge.on text { fill: var(--fg); }
.zone rect { fill: none; stroke: var(--line); stroke-dasharray: 6 5; }
.zone text { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.token { fill: var(--signal); }
.arrowhead { fill: var(--line2); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; border: 2px solid; display: inline-block; }

.status { display: flex; align-items: center; gap: 18px; padding: 0 12px; background: var(--focus-bg); color: var(--fg2); font-family: var(--mono); font-size: 11px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.status .right { margin-left: auto; color: var(--muted); }

/* Command palette */
.palette { position: fixed; inset: 0; background: rgba(5, 8, 14, 0.55); display: grid; place-items: start center; padding-top: 12vh; z-index: 20; }
.palette[hidden] { display: none; }
.palette .box { width: min(640px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); padding: 14px 16px; font: 15px var(--sans); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.palette li .where { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.palette li .what { min-width: 0; }
.palette li .what small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette li.on { background: var(--focus-bg); }
.palette .hint { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; }

@media (max-width: 1100px) { .body { grid-template-columns: 220px minmax(0, 1fr) 300px; } }
@media (max-width: 860px) {
  .shell { height: auto; min-height: 100%; }
  .menu { display: inline-block; }
  .palette-btn { min-width: 0; } .palette-btn .lbl { display: none; }
  .crumbs { display: none; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .explorer { display: none; border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; }
  .shell.nav-open .explorer { display: grid; }
  .center { grid-template-rows: 38px minmax(360px, 60vh) auto; }
  .player { flex-wrap: wrap; padding-block: 8px; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); }
  .status .right { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <header class="topbar">
    <button class="menu" id="menu" type="button" aria-label="Bölümler">☰</button>
    <span class="brand"><i></i>TestDetta Atlası</span>
    <span class="crumbs" id="crumbs"></span>
    <button class="palette-btn" id="palette-btn" type="button"><span class="lbl">Adım, sınıf ya da metot ara…</span><span><kbd>⌘</kbd> <kbd>K</kbd></span></button>
    <button class="theme-btn" id="theme" type="button">Tema: sistem</button>
  </header>
  <div class="body">
    <aside class="explorer" aria-label="Bölümler ve adımlar">
      <div class="filter"><input id="tree-filter" type="search" placeholder="Adımları süz" aria-label="Adımları süz"></div>
      <nav class="tree" id="tree"></nav>
    </aside>
    <section class="center">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="view diagram" id="v-diagram"></div>
      <div class="view" id="v-calls" hidden></div>
      <div class="view" id="v-code" hidden></div>
      <div class="view" id="v-reading" hidden></div>
      <div class="view" id="v-catalog" hidden></div>
      <div class="player">
        <button id="prev" type="button" aria-label="Önceki adım">←</button>
        <button id="play" class="go" type="button">▶ Oynat</button>
        <button id="next" type="button" aria-label="Sonraki adım">→</button>
        <div class="scrub" id="scrub" title="Adıma atla"><i></i></div>
        <span class="count" id="count"></span>
      </div>
    </section>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </div>
  <footer class="status"><span id="status-left"></span><span>kaynak: TestDetta main · 2026-10-11</span><span class="right">← → adım · Boşluk oynat · 1–4 görünüm · ⌘K ara</span></footer>
</div>
<div class="palette" id="palette" hidden>
  <div class="box" role="dialog" aria-label="Ara">
    <input id="palette-input" type="text" placeholder="Adım, sınıf ya da metot adı yazın…" aria-label="Ara" autocomplete="off">
    <ul id="palette-list" role="listbox"></ul>
    <div class="hint"><span>↑↓ seç</span><span>Enter git</span><span>Esc kapat</span></div>
  </div>
</div>

<script>

// Chapters 1 and 2. Helpers: C() prints an escaped code block; c() an inline code span.
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const C = s => `<code class="sig">${esc(s.trim())}</code>`;
const c = s => `<code>${esc(s)}</code>`;
const ul = items => `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`;

const CH_OVERVIEW = {
  id: "genel", short: "Genel bakış", eyebrow: "Bölüm 1 · Uçtan uca",
  title: "Bir değişiklik main'den pull request'e nasıl gider",
  lead: `TestDetta iki anda çalışır. <b>main</b> dalında testlerin tamamı bir kez koşarken her test sınıfının hangi kodu çalıştırdığı kaydedilir (kapsam haritası). Bir <b>pull request</b> geldiğinde değişiklik bu haritayla karşılaştırılır ve yalnız etkilenebilecek test sınıfları koşturulur. Örnek: ${c("Calculator.Tax")} değişti; ${c("Calc.Tests")} içinden yalnız ${c("TaxTests")} koşar.`,
  width: 1000, height: 600,
  zones: [
    { x: 10, y: 20, w: 980, h: 150, label: "main dalı · her birleştirmeden sonra (record modu)" },
    { x: 10, y: 250, w: 980, h: 340, label: "pull request · her push'ta (test modu)" },
  ],
  nodes: [
    { id: "dev", kind: "actor", x: 30, y: 300, w: 180, h: 50, label: "Geliştirici", sub: "push · birleştirme" },

roject:x</code> yazımları dahil): <code>--</code> argümanları bir solution (<code>.sln/.slnx/.slnf</code>), tek proje, dizin ya da hiçbir şey (çalışma dizinindeki tek solution/proje) gösteriyorsa o tek <code>dotnet test</code> ekibin dizininde aynen koşar, yalnız rapor seçeneği eklenir (VSTest: kullanıcı TRX logger'ı vermediyse <code>--logger trx</code>, results dizini eklenmez; MTP: tüm projelerde aynı olmak şartıyla <code>--report-xunit-trx</code> ya da <code>--report-trx</code>). Ekibin results dizinindeki ekibe ait hiçbir şey yönlendirilmez, taşınmaz, silinmez: repo altında ve kullanıcının results dizininde koşu sırasında yazılan <code>.trx</code> dosyaları (<code>TestRunArguments.ReportTimes/Changed</code>) yerinde okunur, <code>TrxReport.Facts</code> ile projelere eşlenip geçici klasöre kopyalanır; yalnız TestDetta'nın kendi eklediği rapor seçeneğinin yazdığı yeni raporlar (kullanıcının results dizininde ya da bir <code>TestResults</code> klasöründe; <code>ShadowRun.IsOwnReport</code>) okunduktan sonra silinir (<code>DeleteOwnReports</code>), ekibin kendi logger'ı varsa hiçbir şey eklenmez ve silinmez. Aksi halde (tek solution yok, legacy proje, aynı assembly adı, MTP'de farklı rapor seçenekleri, dll/test modülleri) komutun kapsamındaki her proje (<code>ShadowScope</code>; kapsam bilinemezse dizinin altındaki her test projesi, <code>run.scopeKnown: false</code>) ekibin dizininden sırayla ayrı koşar ve rapor nedenini söyler (<code>run.kind: per-project</code>, <code>fallbackReason</code>). Çıkış kodu tam koşunundur; başarısız komutun koşturduğu ama rapor yazmayan proje <code>missingReport</code> ile açıklanamayan sayılır. MTP'de koşudan önce derlenmemiş proje (build çıktısı klasörü yok; rapor seçeneği yalnız oradan okunur, paket referanslarından tahmin edilmez) proje proje koşuda rapor almaz; girdisinin gerekçesi, hüküm ve özet bunu açıkça söyler (\"no test report: the project was not built before the run (… did not exist) …; build first and run dotnet test --no-build\", <code>ShadowProject.NotBuilt</code>, <code>FullRun.NotBuiltOutput</code>, JSON <code>notBuilt</code>, <code>totals.notBuiltProjects</code>). Kararlar yalnız bu işin raporlarında görünen sınıflar için gösterilir: koşmayan bilinen sınıflar adlarıyla <code>notRun</code>'da, o zaman projenin kendi modu ve gerekçesi de gösterilmez (<code>partial</code>, koşan sınıflardan türetilir), hiç testi koşmayan proje <code>not-shown</code>; toplamlar yalnız koşanları sayar. Seçimin dışarıda bıraktığı her düşen sınıf test test karşılaştırılarak sınıflandırılır (<code>TrxOutcome.FailedTests</code>): önce değişiklikle tek başına; tam koşuda düşen bir test yine düşerse merge base'te ayrı bir <code>git worktree</code>'de tek başına (değişiklikle düşen her test orada da düşerse pre-existing, biri geçerse <b>miss</b>); tek başına geçerse projesi tam koşudaki bağlamda (kullanıcının argümanlarıyla) yeniden koşar: orada da geçerse flaky, yine düşerse sıra bağımlı ve aynı bağlam base'te karar verir (pre-existing ya da \"order-dependent, caused by the change\" miss); koşamazsa unclassified. Yeniden koşular raporlarını yalnız TestDetta'nın klasörüne yazar (<code>ShadowRun.RerunArguments</code>: kullanıcının results dizini, TRX logger'ı ve MTP rapor seçenekleri çıkarılır; base'te ayrıca <code>--no-build</code>, <code>--no-restore</code>, <code>-o/--output</code>, <code>--artifacts-path</code>). Süre sınırları <code>ShadowLimits</code>'te (analiz 10 dk; değişiklikle yeniden koşu 15 dk / 5 dk boşta, base'te 30 dk / 10 dk; hepsi <code>--shadow-*-timeout</code> seçenekleri ve Action girdileri); üstlerinde tam koşudan sonra başlayan bir bütçe (<code>--shadow-classify-budget</code>, 45 dk, <code>ShadowBudget</code>): her yeniden koşunun, base checkout'unun ve build çıktısı sorgularının süresi kalana kırpılır, bütçe bitince kalan adaylar \"the classification time budget (45 min) ran out\" notuyla unclassified olur; tam koşu ve çıkış kodu etkilenmez. Süreler: tüm koşunun ölçülen duvar süresi (<code>run.wallSeconds</code>) hükümde; tek komutta proje süresi raporların başlangıç–bitişi. Rapor (şema 4): <code>.testdetta/testdetta-shadow.json</code>, iş özeti (tablo hücrelerinde <code>|</code> kaçırılır, <code>MarkdownSummary.TableCode</code>), konsol; yeniden üretme bloğu (sürüm, SHA-256, commit'ler, harita özetleri, kabuğa uygun tırnaklı lisanssız <code>td test --shadow</code> komutu ve lisans isteyen <code>td affected … --format json</code>). Ayrıntı: <code>docs/design/shadow-mode.md</code>.</p><p><b>td audit</b> (<code>CliApp.Audit</code> → <code>AuditRun.Run</code>): aynı seçim, ekibin kendi kodunda değerlendirmenin yöntemiyle sınanır. Başta <code>HEAD</code> kaydedilir ve kirli ağaç reddedilir. Çalışma ağacı (derleme çıktısı ve .git dahil) <code>AuditWorkspace</code> ile yalnız sahibinin okuyabildiği (0700) bir çalışma klasörüne kopyalanır (APFS/Btrfs'te copy-on-write; her kopyadan önce boş yer kontrolü); sahip dosyası kilitli tutulur. Kopyada hiçbir şey derlenmeden önce <code>AuditOutputPaths.Query</code> tek bir MSBuild sürücüsüyle her projenin nereye yazdığını sorar (<code>TargetPath</code>, <code>OutputPath</code>, <code>IntermediateOutputPath</code>, <code>BaseOutputPath</code>, artifacts…); kopyanın dışında kalan (linkler çözülerek) bir yol ya da mutlak <code>-o</code>/<code>--results-directory</code> denetimi başlatmaz. O klasörlerdeki dosya linkleri gerçek dosyaya çevrilir (<code>MaterializeLinks</code>). Temel koşu her test projesini kopyada ekibin <code>dotnet test</code>'i gibi raporla koşar (orada derler, bütçe içinde); kendi filtresi sınıf filtresiyle birleşemeyen proje (xUnit v3 class/query, TUnit tree-node) denetlenmez. Yeniden yazılacak her dll ve pdb her kopyada bağımsız dosya yapılır (<code>Detach</code>: sembolik ve hard link). Örnek: <code>TargetSampler</code> ile <code>SampleRequest.Uniform</code> (kapsam kullanılmaz, üye + tohum özetinden sabit sıra). Her değişiklik (<code>AuditTrial</code>): <code>MutationInjector.Inject</code> kopyadaki dll'lere, seçim <code>AuditSelector</code> ile kaydedilen commit'e karşı yapılır (düzenleme <code>git cat-file --filters</code> ile o commit'in metnine, bellekte <code>AnalysisOptions.WorkingTreeOverlay</code>; analizden önce ve sonra HEAD ve temiz ağaç denetlenir, değiştiyse hata). Yargı kuralı: her şüphe TestDetta'nın aleyhine. Mutantlı dll'i tutan her proje tamamen koşar; dışarıda kalan düşen sınıf değişiklikle tek başına düşüp değişikliksiz tek başına geçerse <b>miss</b>; seçilen düşen sınıf aynı iki koşuyla doğrulanmadan <b>caught</b> sayılmaz; tek başına koşuda hiç testi koşmayan sınıf inconclusive. Tamamlanmayan koşu (çökme, takılma, testsiz başarısız çıkış kodu, abort raporu, temel koşudan az sınıf) değişikliksiz yeniden koşar: dışarıda kalan kısım yalnız değişikliksiz tamamlanıyor ve değişiklikle tekrarında yine tamamlanmıyorsa miss (tekrarda tamamlanırsa inconclusive, 2026-10-08), seçilen kısımdaki çökme ancak tekrarlarsa caught, koşu değişikliksiz de tamamlanmazsa inconclusive. Geri yükleme sonuç kaydedildikten sonra yapılır; iptal, hata ya da başarısız geri yüklemeden önce doğrulanmış miss korunur. <code>AuditLoop</code>: <code>--target-broken</code> (100), <code>--max-mutants</code>, <code>--budget</code> (4 sa, yalnız yeni değişikliği durdurur; koşan değişiklik kendi sınırlarıyla biter, yargılananlar sıranın öneki), örnek sonu, 1 GB altı boş yer (hata); iptal ve süre aşımında <code>AuditProcess</code> süreç ağacını öldürür (çıktı İngilizce: <code>DOTNET_CLI_UI_LANGUAGE=en</code>, <code>VSLANG=1033</code>; <code>GIT_OPTIONAL_LOCKS=0</code>). Bütçe yalnız yeni değişikliği durdurduğu için denetim bütçeden sonra bitebilir: <code>AuditRun.Progress</code> bütçe bittikten sonra biten değişiklikleri not eder (<code>AuditResult.FinishedAfterBudget</code>), <code>AuditReport.OverBudget</code> ne kadar aştığını ve nedenini (o değişiklikler ya da bütçenin kesmediği adımlar) konsola, özete ve JSON'a (<code>run.overBudgetSeconds</code>, <code>finishedAfterBudget</code>, <code>overBudget</code>) yazar. Mezuniyet kanıtı (<code>AuditGraduation.Judge</code>): en az 100 değişiklik test kırmış, 0 miss ve en kötü durum sınırı gösterildiği gibi (yukarı yuvarlanmış, <code>AuditReport.Tenths</code>) en çok %3.0; <code>--member</code> ile yapılan koşu hiçbir zaman kanıt değildir; her rapor tek satırda \"yes: …\" / \"not yet: …\" / \"no: …\" der (JSON <code>graduation</code>). Rapor: <code>testdetta-audit.json</code> (şema 3), iş özeti, konsol; çalışma klasörü silinmeden önce yazılır; hüküm \"On your code: n changes, k broke tests, m missed (95% upper bound …, n = k); i inconclusive, s stopped (worst case, counting them as misses: …)\", sınırlar yukarı yuvarlanır (n = 100, kaçırma yok: 3.0%).</p>",

      for (const [id, list] of Object.entries(stepButtons)) list.forEach((b, i) => b.classList.toggle("on", id === ch.id && i === state.step));
      stepButtons[ch.id]?.[state.step]?.scrollIntoView({ block: "nearest" });
      if (ch.catalog) { crumbs("Bileşen kataloğu"); renderCatalogInspector(); $("#status-left").textContent = `${catalog.length} sınıf`; return; }
      const s = ch.steps[state.step];
      crumbs(ch.short, s.title);
      $("#count").textContent = `${state.step + 1} / ${ch.steps.length}`;
      $("#scrub i").style.width = `${((state.step + 1) / ch.steps.length) * 100}%`;
      $("#status-left").textContent = `${ch.eyebrow} · adım ${state.step + 1}/${ch.steps.length}`;
      renderInspector(ch, s);
      if (state.view === "diagram") renderDiagram(s);
      if (state.view === "calls") renderCalls(ch);
      if (state.view === "code") renderCode(s);
      if (state.view === "reading") renderReading(ch);
    }

    function crumbs(...parts) {
      const last = parts.pop();
      $("#crumbs").replaceChildren(document.createTextNode(["Atlas", ...parts].join(" › ") + " › "), h("b", null, last));
    }

    function renderDiagram(s) {
      const onN = new Set(s.nodes || []), onE = new Set(s.edges || []);
      for (const [id, g] of Object.entries(drawn.nodes)) { g.classList.toggle("on", onN.has(id)); g.classList.toggle("dim", onN.size > 0 && !onN.has(id)); }
      for (const [id, e] of Object.entries(drawn.edges)) {
        e.g.classList.toggle("on", onE.has(id)); e.g.classList.toggle("dim", onE.size > 0 && !onE.has(id));
        e.path.setAttribute("marker-end", `url(#${onE.has(id) ? "ahon" : "ah"}-${state.ch.id})`);
      }
      cancelAnimationFrame(raf);
      const paths = (s.edges || []).map(id => drawn.edges[id]?.path).filter(Boolean);
      if (!paths.length || reduced) { drawn.token.setAttribute("opacity", 0); return; }
      const start = performance.now(), per = 800;
      const tick = now => {
        const t = (now - start) / per, k = Math.min(paths.length - 1, Math.floor(t)), f = Math.min(1, t - k);
        const p = paths[k], pt = p.getPointAtLength(p.getTotalLength() * f);
        drawn.token.setAttribute("cx", pt.x); drawn.token.setAttribute("cy", pt.y); drawn.token.setAttribute("opacity", 1);
        if (t < paths.length) raf = requestAnimationFrame(tick); else drawn.token.setAttribute("opacity", 0);
      };
      raf = requestAnimationFrame(tick);
    }

    function renderCalls(ch) {
      const rows = CALLS[ch.id] || ch.steps.map((s, i) => [s.title, 0, i]);
      const v = views.calls; v.replaceChildren();
      const wrap = h("div", "waterfall");
      const ruler = h("div", "wf-ruler"); ruler.append(h("span", null, "çağrı"));
      const ticks = h("span", "ticks"); ticks.append(h("span", null, "başla"), h("span", null, "sıra · iç içelik"), h("span", null, "bitti")); ruler.append(ticks);
      wrap.append(ruler);
      const colors = ["var(--signal)", "var(--focus)", "var(--type)", "var(--ok)", "var(--warn)"];
      rows.forEach(([name, depth, step], i) => {
        let end = i + 1; while (end < rows.length && rows[end][1] > depth) end++;
        const row = h("div", "wf-row" + (step === state.step ? " on" : ""));
        const nm = h("div", "nm"); nm.style.paddingLeft = `${depth * 16}px`;
        nm.append(h("i", null, depth ? "└ " : ""), document.createTextNode(name));
        const lane = h("div", "lane"), bar = h("b");
        bar.style.left = `${(i / rows.length) * 100}%`; bar.style.width = `${Math.max(1.5, ((end - i) / rows.length) * 100)}%`; bar.style.background = colors[depth % colors.length];
        lane.append(bar); row.append(nm, lane);
        row.title = `Adım ${step + 1}: ${ch.steps[step].title}`;
        row.addEventListener("click", () => go(ch, step));
        wrap.append(row);
      });
      wrap.append(h("div", "wf-note", "Çubuklar çağrı sırasını ve iç içeliği gösterir, süreyi değil. Bir satıra tıklayınca o adım seçilir; argümanlar ve dönüş Inspector'da."));
      v.append(wrap);
    }

    function renderCode(s) {
      const v = views.code; v.replaceChildren();
      const box = h("div", "codeview");
      const { code } = split(s.body);
      const blocks = [...code];
      if (!blocks.length) {
        const e = h("div", "empty"); e.append(h("b", null, "Bu adımda kod alıntısı yok."), h("span", null, "İmza ve dosya Inspector'da; yandaki adımlarda alıntılar var."));
        box.append(e);
      }
      blocks.forEach((src, i) => {
        const cb = h("div", "codeblock");
        const head = h("div", "cb-head"); head.append(h("span", null, `${s.file ? textOf(s.file).split(",")[0] : "alıntı"} · ${i + 1}/${blocks.length}`));
        const btn = h("button", "mini", "Kopyala"); btn.type = "button"; btn.addEventListener("click", () => copy(src, btn));
        head.append(btn);
        const pre = h("pre"); pre.append(highlight(src));
        cb.append(head, pre); box.append(cb);
      });
      v.append(box);
    }

    function renderReading(ch) {
      const v = views.reading; v.replaceChildren();
      const r = h("div", "reading");
      r.append(h("div", "kicker", ch.eyebrow), h("h1", null, ch.title));
      const lead = h("p", "lead"); setHtml(lead, ch.lead); r.append(lead);
      if (ch.note) { const n = h("div", "note"); setHtml(n, ch.note); r.append(n); }
      const tl = h("div", "timeline");
      ch.steps.forEach((s, i) => {
        const item = h("div", "tl" + (i === state.step ? " on" : "")); item.dataset.n = String(i + 1);
        item.append(h("h4", null, s.title), h("div", "who", textOf(s.who)));
        const p = h("p"); setHtml(p, s.purpose); item.append(p);
        item.addEventListener("click", () => go(ch, i));
        tl.append(item);
      });
      r.append(tl); v.append(r);
      v.querySelector(".tl.on")?.scrollIntoView({ block: "nearest" });
    }

    function section(title, content, mono) {
      const s = h("div", "sect"); s.append(h("h3", null, title));
      const c = h("div", "c" + (mono ? " mono" : "")); if (typeof content === "string") setHtml(c, content); else if (content instanceof DocumentFragment) c.append(sanitizedNodes(content)); else c.append(content);
      s.append(c); return s;
    }
    function renderInspector(ch, s) {
      insp.replaceChildren();
      const head = h("div", "insp-head"); head.append(h("div", "eyebrow", `${ch.short} · adım ${state.step + 1}`), h("h2", null, s.title));
      insp.append(head);
      if (s.who) insp.append(section("Kim", s.who, true));
      if (s.file) {
        const f = h("div", "file"); const span = h("span"); setHtml(span, s.file);
        const b = h("button", "mini", "Kopyala"); b.type = "button"; b.addEventListener("click", () => copy(textOf(s.file), b));
        f.append(span, b); insp.append(section("Dosya", f));
      }
      if (s.input) insp.append(section("Girdi", s.input));
      if (s.output) insp.append(section("Çıktı", s.output));
      if (s.purpose) insp.append(section("Amaç", s.purpose));
      const { code, rest } = split(s.body);
      if (rest.textContent.trim()) insp.append(section("Ayrıntılar", rest));
      if (code.length) {
        const b = h("button", "mini", `Kod sekmesinde ${code.length} alıntı →`); b.type = "button"; b.addEventListener("click", () => setView("code"));
        insp.append(section("Kod", b));
      }
    }
    function renderCatalogInspector(row) {
      insp.replaceChildren();
      const head = h("div", "insp-head"); head.append(h("div", "eyebrow", "Bileşen kataloğu"), h("h2", null, row ? row.name : "Bir satır seçin"));
      insp.append(head);
      if (!row) { insp.append(section("Nasıl", "Akışlarda geçen her sınıf tek satırda. Süzmek için tablonun üstündeki kutuyu ya da <kbd>⌘K</kbd> paletini kullanın; satıra tıklayınca ayrıntı burada açılır.")); return; }
      insp.append(section("Dosya", row.file, true), section("Ne yapar", row.what), section("Ana metot", row.sig), section("Çağıran", row.by));
    }

    // Catalog view
    (function buildCatalog() {
      const v = views.catalog; const box = h("div", "catalog");
      const input = h("input"); input.type = "search"; input.id = "catalog-filter"; input.placeholder = "Süz: ör. Selector, map, record"; input.setAttribute("aria-label", "Kataloğu süz");
      input.style.cssText = "background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font:13px var(--sans);width:min(420px,100%)";
      const table = h("table"), thead = h("thead"), hr = h("tr");
      hr.append(h("th", null, "Sınıf"), h("th", null, "Ne yapar"), h("th", null, "Ana metot")); thead.append(hr); table.append(thead);
      const tb = h("tbody");
      for (const r of catalog) {
        const tr = h("tr"); const n = h("td", "name"); n.append(document.createTextNode(r.name), h("br"), h("span", "area", r.file));
        const w = h("td"); setHtml(w, r.what); const sg = h("td"); setHtml(sg, r.sig);
        tr.append(n, w, sg); tr.dataset.text = (r.name + " " + r.file + " " + textOf(r.what) + " " + textOf(r.sig)).toLowerCase();
        tr.style.cursor = "pointer"; tr.addEventListener("click", () => renderCatalogInspector(r));
        tb.append(tr);
      }
      table.append(tb);
      input.addEventListener("input", () => { const q = input.value.trim().toLowerCase(); for (const tr of tb.children) tr.hidden = q.length > 0 && !tr.dataset.text.includes(q); });
      box.append(input, table); v.append(box);
      Atlas.filterCatalog = q => { input.value = q; input.dispatchEvent(new Event("input")); };
    })();

    // Player
    function stop() { clearInterval(state.timer); state.timer = null; $("#play").textContent = "▶ Oynat"; }
    function play() {
      if (state.timer) { stop(); return; }
      if (state.step >= state.ch.steps.length - 1) go(state.ch, 0);
      $("#play").textContent = "❚❚ Durdur";
      state.timer = setInterval(() => { if (state.step >= state.ch.steps.length - 1) { stop(); return; } go(state.ch, state.step + 1); }, 4200);
    }
    $("#play").addEventListener("click", play);
    $("#prev").addEventListener("click", () => { stop(); go(state.ch, state.step - 1); });
    $("#next").addEventListener("click", () => { stop(); go(state.ch, state.step + 1); });
    $("#scrub").addEventListener("click", ev => {
      const r = ev.currentTarget.getBoundingClientRect(); stop();
      go(state.ch, Math.floor(((ev.clientX - r.left) / r.width) * state.ch.steps.length));
    });

    // Palette
    const pal = $("#palette"), palInput = $("#palette-input"), palList = $("#palette-list");
    const items = [];
    chapters.forEach((ch, ci) => ch.steps.forEach((s, si) => items.push({ where: `${ci + 1}.${String(si + 1).padStart(2, "0")}`, title: s.title, sub: textOf(s.who), run: () => go(ch, si) })));
    catalog.forEach(r => items.push({ where: "sınıf", title: r.name, sub: r.file, run: () => { go(all[all.length - 1], 0); Atlas.filterCatalog(r.name.split(" ")[0]); renderCatalogInspector(r); } }));
    let palSel = 0, palHits = [];
    function openPalette() { pal.hidden = false; palInput.value = ""; filterPalette(); palInput.focus(); }
    function closePalette() { pal.hidden = true; }
    function filterPalette() {
      const words = palInput.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      palHits = items.filter(it => { const t = (it.where + " " + it.title + " " + it.sub).toLowerCase(); return words.every(w => t.includes(w)); }).slice(0, 60);
      palSel = 0; drawPalette();
    }
    function drawPalette() {
      palList.replaceChildren(...palHits.map((it, i) => {
        const li = h("li", i === palSel ? "on" : ""); li.setAttribute("role", "option");
        const what = h("div", "what"); what.append(document.createTextNode(it.title), h("small", null, it.sub));
        li.append(h("span", "where", it.where), what);
        li.addEventListener("click", () => { closePalette(); it.run(); });
        return li;
      }));
      palList.children[palSel]?.scrollIntoView({ block: "nearest" });
    }
    palInput.addEventListener("input", filterPalette);
    palInput.addEventListener("keydown", ev => {
      if (ev.key === "ArrowDown") { palSel = Math.min(palHits.length - 1, palSel + 1); drawPalette(); ev.preventDefault(); }
      if (ev.key === "ArrowUp") { palSel = Math.max(0, palSel - 1); drawPalette(); ev.preventDefault(); }
      if (ev.key === "Enter" && palHits[palSel]) { closePalette(); palHits[palSel].run(); }
      if (ev.key === "Escape") closePalette();
    });
    pal.addEventListener("click", ev => { if (ev.target === pal) closePalette(); });
    $("#palette-btn").addEventListener("click", openPalette);

    // Keys, theme, menu
    document.addEventListener("keydown", ev => {
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); pal.hidden ? openPalette() : closePalette(); return; }
      if (!pal.hidden || ev.target.closest("input")) return;
      if (ev.key === "/") { ev.preventDefault(); openPalette(); }
      else if (ev.key === "ArrowRight") { stop(); go(state.ch, state.step + 1); }
      else if (ev.key === "ArrowLeft") { stop(); go(state.ch, state.step - 1); }
      else if (ev.key === " " && !ev.target.closest("button")) { ev.preventDefault(); play(); }
      else if (["1", "2", "3", "4"].includes(ev.key)) setView(tabDefs[Number(ev.key) - 1][0]);
    });
    const themes = ["system", "dark", "light"];
    function applyTheme(t) { if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); $("#theme").textContent = { system: "Tema: sistem", dark: "Tema: koyu", light: "Tema: açık" }[t]; store.set("atlas.theme", t); }
    let theme = store.get("atlas.theme") || "system"; applyTheme(theme);
    $("#theme").addEventListener("click", () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; applyTheme(theme); });
    $("#menu").addEventListener("click", () => shell.classList.toggle("nav-open"));

    // Start where the viewer left off, or at the beginning.
    const [atCh, atStep] = (store.get("atlas.at") || "").split(":");
    const first = all.find(c => c.id === atCh) || chapters[0];
    for (const b of tabs.children) b.classList.toggle("on", b.dataset.view === state.view);
    go(first, Number(atStep) || 0);
    if (!first.catalog) setView(state.view);
  } };
})();


Atlas.start([CH_OVERVIEW, CH_RECORD, CH_TEST, CH_MAP, CH_EVAL], CATALOG);
</script>
