name: License check

# Run by hand (launch checklist, "Test the license in CI"): installs the released td from nuget.org and checks the
# license in the TESTDETTA_LICENSE secret against this private repository, with the refresh through
# license.testdetta.com, then the same without a license. Nothing here fails because of the license itself; read
# the step output. The repository's other workflows never read the secret.
on:
  workflow_dispatch:
    inputs:
      version:
        description: TestDetta package version to install
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install the released td
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet tool install --global TestDetta --version "$VERSION" && td --version

      - name: With the license (signature, scope, seats, refresh)
        env:
          TESTDETTA_LICENSE: ${{ secrets.TESTDETTA_LICENSE }}
        run: td license status -v

      # An empty home: the step above stored the refreshed license in ~/.testdetta, as a persistent agent keeps it.
      - name: Without a license (every test runs, the job does not fail)
        run: |
          export HOME="$RUNNER_TEMP/no-license-home" DOTNET_CLI_HOME="$HOME"
          mkdir -p "$HOME"
          td license status
