name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull requests list the Actions caches to find the newest coverage map.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # On main every commit gets a coverage map; recording is also the full test run.
      - name: Record coverage
        if: github.event_name == 'push'
        uses: ./
        with:
          mode: record
          setup-dotnet: 'false'

      # Pull requests run only the tests their changes affect.
      - name: Run affected tests
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: test
          setup-dotnet: 'false'
