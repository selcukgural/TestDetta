name: CI

# Every push gets only the quick job; the coverage map is recorded by hand.
# The weekly recording (Mondays 02:00) is off: the tests that record or start their own test runs
# fail under the outer recorder (12 of 949 in October 2026), so each run spent about 70 minutes on a
# known failure. Restore `schedule: - cron: '0 2 * * 1'` once those tests pass under recording.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Recording takes about 20 minutes, so a push does not record.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull requests list the Actions caches to find the newest coverage map.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # By hand, main gets a coverage map; recording is also a full test run (Slow tests
      # included), one test at a time, so it takes several times the plain run. Four processes gained
      # little: the slow tests build real projects and compete for the same cores. Maps a few commits
      # old are used through the drift bridge.
      - name: Record coverage
        if: github.event_name != 'pull_request'
        uses: ./
        with:
          mode: record
          setup-dotnet: 'false'

      # The evaluation tool's tests (Category=Eval) and the tests that build and record real projects
      # (Category=Slow, 28 of a pull request's 30 minutes) run on a pull request only when it changes
      # what they test: the tool, the corpus, the recorder and its runtime, the mutants, the build
      # settings, or one of those tests. The recording runs them all; locally they run before a push.
      - name: Choose the tests to leave out
        id: eval
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          tests=$(printf '%s\n' "$changed" | { grep -E '^tests/.*\.cs$' || true; } | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
          has_trait() { [ -n "$tests" ] && grep -lF "[Trait(\"Category\", \"$1\")]" $tests > /dev/null; }
          filters=()
          if printf '%s\n' "$changed" | grep -qE '^(tools/TestDetta\.Eval|eval)/' || has_trait Eval; then
            echo "Changes reach the evaluation tool: its tests run."
          else
            echo "No change to the evaluation tool: its tests are left out."
            filters+=("Category!=Eval")
          fi
          if printf '%s\n' "$changed" | grep -qE '^(src/TestDetta\.Coverage(\.Runtime)?|src/TestDetta\.Mutants|tools/TestDetta\.Eval)/|^(global\.json|Directory\.Build\.(props|targets)|Directory\.Packages\.props)$' || has_trait Slow; then
            echo "Changes reach the recorder or the build: the slow tests run."
          else
            echo "No change to the recorder or the build: the slow tests are left out."
            filters+=("Category!=Slow")
          fi
          if [ ${#filters[@]} -eq 0 ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--filter $(IFS='&'; echo "${filters[*]}")" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests run only the tests their changes affect.
      - name: Run affected tests
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: test
          setup-dotnet: 'false'
          dotnet-test-args: ${{ steps.eval.outputs.args }}

  # The pass/fail signal within three minutes on every push. The Slow tests build and run real
  # projects; they run in the recording above and before every push locally. It runs under a
  # Turkish locale (dotted and dotless i, comma decimals), where culture-sensitive code breaks first:
  # users run TestDetta on any locale, and the recording job keeps the runner's default one covered.
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 'true'
      LC_ALL: tr_TR.UTF-8
      LANG: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --nologo --filter "Category!=Slow&Category!=Legacy"

      - name: Test the Claude Code plugin's Stop hook
        run: bash dist/claude-plugin/tests/stop-hook.test.sh
