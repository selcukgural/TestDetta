name: CI

# The repository is private and Actions minutes are limited (about 3,000 a month): every push gets
# only the quick job; the coverage map is recorded once a week or by hand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Recording takes about 20 minutes, so a push does not record.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull requests list the Actions caches to find the newest coverage map.
      actions: read
    # The license service's tests need a Postgres; each test makes and drops its own database.
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTDETTA_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only;Database=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Weekly or by hand, main gets a coverage map; recording is also a full test run (Slow tests
      # included), one test at a time, so it takes several times the plain run. Four processes gained
      # little: the slow tests build real projects and compete for the same cores. Maps a few commits
      # old are used through the drift bridge.
      - name: Record coverage
        if: github.event_name != 'pull_request'
        uses: ./
        with:
          mode: record
          setup-dotnet: 'false'

      # Pull requests run only the tests their changes affect.
      - name: Run affected tests
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: test
          setup-dotnet: 'false'

  # The pass/fail signal within three minutes on every push. The Slow tests build and run real
  # projects; they run in the weekly recording above and before every push locally. It runs under a
  # Turkish locale (dotted and dotless i, comma decimals), where culture-sensitive code breaks first:
  # customers run TestDetta on any locale, and the weekly job keeps the runner's default one covered.
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTDETTA_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only;Database=postgres
      CI: 'true'
      LC_ALL: tr_TR.UTF-8
      LANG: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --nologo --filter "Category!=Slow&Category!=Legacy"
